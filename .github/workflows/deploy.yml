name: Deploy Backend to VPS (Docker)

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-adverify
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/adverify-backend
  VPS_PATH: /root/adverifysdk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy docker-compose.yml to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 root@${{ secrets.VPS_HOST }} "mkdir -p ${{ env.VPS_PATH }}/uploads"
          scp -i ~/.ssh/deploy_key -P 22 \
            ./server/docker-compose.yml \
            root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/docker-compose.yml

      - name: Pull new image and restart on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 root@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ env.VPS_PATH }}
            if [ ! -f .env ]; then
              echo "ERROR: ${{ env.VPS_PATH }}/.env is missing. Create it once (production secrets) and re-run." >&2
              exit 1
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
